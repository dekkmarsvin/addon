name: Release Addon

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vX.Y.Z tag, exactly matching package.json"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HUSKY: "0"
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.release_tag }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Require an exact version tag on this source commit
        id: tag
        run: pnpm release:tag
      - name: Frozen dependency installation
        run: pnpm install --frozen-lockfile
      - name: Unit regressions
        run: pnpm test
      - name: Typecheck
        run: pnpm compile
      - name: Build and zip Chrome and Firefox MV3
        run: pnpm zip
      - name: Verify fork identities, ZIP contents and checksums
        run: pnpm release:artifacts
      - name: Install test Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Real MV3 bridge with isolated browser fixtures
        run: pnpm test:browser
      - name: Recheck release assets and unchanged tagged source
        run: |
          pnpm release:check
          pnpm release:tag
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ steps.tag.outputs.commit }}
          name: Kotoban Addon ${{ steps.tag.outputs.tag }}
          prerelease: false
          make_latest: true
          overwrite_files: false
          fail_on_unmatched_files: true
          body: |
            Chrome/Edge: extract the Chromium ZIP and load it as an unpacked extension.
            Firefox: the unsigned temporary ZIP is for temporary loading in about:debugging only.
            There is no signed XPI or automatic-update channel in this release.
            The source ZIP, release-manifest.json and SHA256SUMS identify the same tested build.
            Source: https://github.com/${{ github.repository }}/tree/${{ steps.tag.outputs.tag }}
          files: |
            release-assets/*.zip
            release-assets/release-manifest.json
            release-assets/SHA256SUMS
