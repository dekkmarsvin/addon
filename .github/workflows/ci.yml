name: Verify Addon

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Frozen dependency installation
        run: pnpm install --frozen-lockfile
      - name: Unit regressions
        run: pnpm test
      - name: Typecheck
        run: pnpm compile
      - name: Build and zip Chrome and Firefox MV3
        run: pnpm zip
      - name: Verify fork identities, ZIP contents and checksums
        run: pnpm release:artifacts
      - name: Install test Chromium
        if: matrix.node == 24
        run: pnpm exec playwright install --with-deps chromium
      - name: Real MV3 bridge with isolated browser fixtures
        if: matrix.node == 24
        run: pnpm test:browser
      - name: Recheck prepared release artifacts
        run: pnpm release:check
      - uses: actions/upload-artifact@v4
        with:
          name: kotoban-addon-node${{ matrix.node }}-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
